<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003f73">
  <link rel="canonical" href="https://www.joditecnologias.com.br/links">
  <title>JODI | Site oficial e Workshop</title>
  <meta name="description" content="Conheça o site oficial da JODI Tecnologias e acesse o Workshop Micro-ondas na Prática.">
  <meta property="og:title" content="JODI | Site oficial e Workshop">
  <meta property="og:description" content="Tecnologia micro-ondas para a indústria. Escolha por onde começar.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="/assets/images/logo_jodi_azul.svg" type="image/svg+xml">
  <link rel="preload" href="/workshop-micro-ondas/media/exo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:"Exo 2";src:url("/workshop-micro-ondas/media/exo-2-latin.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
    :root{color-scheme:light;--blue:#003f73;--orange:#ff7a00;--ink:#102f49}
    *{box-sizing:border-box}
    body{margin:0;min-width:280px;min-height:100vh;min-height:100svh;background:#f2f6fa;color:var(--ink);font-family:"Exo 2",Arial,sans-serif;display:grid;justify-items:center;align-items:start;padding:clamp(24px,5svh,48px) 20px;position:relative;isolation:isolate}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 0%,#fff 5%,transparent 65%),linear-gradient(135deg,transparent 65%,#e4edf5)}
    body:after{content:"";position:fixed;width:680px;height:680px;border:1px solid #003f730b;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 65px #003f7303,0 0 0 130px #003f7303;pointer-events:none;z-index:-1}
    main{width:100%;max-width:460px;text-align:center}
    .brand{width:200px;height:150px;display:block;margin:-22px auto -10px}
    .eyebrow{margin:0 0 12px;color:#507086;font-size:11px;font-weight:650;letter-spacing:2.4px;text-transform:uppercase}
    h1{margin:0;font-size:clamp(23px,5.8vw,28px);line-height:1.2;letter-spacing:-.6px;font-weight:650;color:var(--blue)}
    h1 span{display:block}
    .intro{margin:12px 0 22px;font-size:15px;line-height:1.6;color:#52697d}
    nav{display:grid;gap:14px;text-align:left}
    .link{position:relative;display:flex;align-items:center;gap:16px;min-height:112px;padding:23px;border-radius:18px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid #dce5ed;box-shadow:0 5px 15px #103d6505;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .icon{flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#eaf2f9;color:var(--blue)}
    svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .words{flex:1;min-width:0}
    .title{display:block;font-size:19px;font-weight:650;line-height:1.25;letter-spacing:-.3px}
    .description{display:block;margin-top:6px;font-size:13px;line-height:1.45;color:#52697d}
    .arrow{width:19px;height:19px;flex:0 0 19px;color:var(--blue)}
    .workshop{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 12px 26px #003f731c}
    .workshop .icon{background:var(--orange);color:#102f49}
    .workshop .description{color:#d1e0ed}
    .workshop .arrow{color:#fff}
    .tag{display:inline-block;margin-bottom:9px;color:#ffae63;font-size:10px;line-height:1;font-weight:700;text-transform:uppercase;letter-spacing:1.7px}
    .link:hover{transform:translateY(-3px);box-shadow:0 12px 28px #003f7318;border-color:#166cb4}
    .link:active{transform:translateY(0)}
    .link:focus-visible{outline:3px solid #b24b00;outline-offset:5px}
    footer{margin-top:34px;color:#63788b;font-size:11px;letter-spacing:.5px}
    .accent{display:block;width:28px;height:3px;background:var(--orange);border-radius:3px;margin:0 auto 16px}
    @media(max-width:360px){body{padding:26px 16px}.link{padding:20px 16px;gap:12px}.title{font-size:17px}.description{font-size:12px}}
    @media(prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
  </style>
  <script src="/workshop-micro-ondas/tracking.js" defer></script>
</head>
<body>
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T4DKLGB8" title="Google Tag Manager" width="0" height="0" hidden></iframe>
    <img src="https://www.facebook.com/tr?id=1364581961221667&amp;ev=PageView&amp;noscript=1" alt="" width="1" height="1" hidden>
  </noscript>
  <main>
    <header>
      <img class="brand" src="/assets/images/logo_jodi_azul.svg" width="200" height="150" alt="JODI Tecnologias">
      <p class="eyebrow">Engenharia &amp; tecnologia</p>
      <h1>Tecnologia micro-ondas<span>para a indústria.</span></h1>
      <p class="intro">Conheça a JODI e o nosso workshop.<br>Escolha por onde começar.</p>
    </header>
    <nav aria-label="Links da JODI">
      <a class="link" href="https://www.joditecnologias.com.br/?utm_source=instagram&amp;utm_medium=organic_social&amp;utm_campaign=link_bio&amp;utm_content=site_oficial" data-destination="site_oficial">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></span>
        <span class="words"><span class="title">Site oficial da JODI</span><span class="description">Conheça nossas tecnologias e aplicações.</span></span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </a>
      <a class="link workshop" href="https://www.joditecnologias.com.br/workshop?utm_source=instagram&amp;utm_medium=organic_social&amp;utm_campaign=link_bio&amp;utm_content=workshop" data-destination="workshop">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="m10 8 5 2.5-5 2.5zM8 21h8m-4-4v4"/></svg></span>
        <span class="words"><span class="tag">Workshop JODI</span><span class="title">Micro-ondas na Prática</span><span class="description">Veja a programação e faça sua inscrição.</span></span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </a>
    </nav>
    <footer><span class="accent" aria-hidden="true"></span>JODI Tecnologias</footer>
  </main>
  <script>
    // Preserva a origem da visita nos dois destinos, inclusive no navegador do Instagram.
    const incoming = new URLSearchParams(window.location.search);
    document.querySelectorAll('[data-destination]').forEach(link => {
      const destination = new URL(link.href);
      const defaults = {utm_source:'instagram',utm_medium:'organic_social',utm_campaign:'link_bio',utm_content:link.dataset.destination};
      Object.entries(defaults).forEach(([key,value]) => destination.searchParams.set(key,incoming.get(key) || value));
      ['utm_term','fbclid'].forEach(key => {if(incoming.get(key)) destination.searchParams.set(key,incoming.get(key));});
      link.href = destination.href;
    });
  </script>
</body>
</html>

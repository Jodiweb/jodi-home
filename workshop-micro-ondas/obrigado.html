<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Obrigado pela inscrição | Workshop JODI</title>
    <link rel="icon" type="image/png" href="/assets/images/Jodi_fivecon.png" />
    <link rel="stylesheet" href="/workshop-micro-ondas/workshop.css" />
    <script src="/workshop-micro-ondas/tracking.js" defer></script>
  </head>
  <body class="workshop-thanks">
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-T4DKLGB8"
        title="Google Tag Manager"
        width="0"
        height="0"
        hidden
      ></iframe>
      <img
        src="https://www.facebook.com/tr?id=1364581961221667&amp;ev=PageView&amp;noscript=1"
        alt=""
        width="1"
        height="1"
        hidden
      />
    </noscript>
    <main class="thanks-layout wrap">
      <img
        class="thanks-logo logo"
        src="/assets/images/logo_jodi_branca.svg"
        alt="JODI Tecnologias"
        width="160"
        height="120"
      />
      <section class="thanks-card" aria-labelledby="thanks-title">
        <span class="thanks-status">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Inscrição recebida
        </span>
        <h1 id="thanks-title">Falta só mais uma etapa</h1>
        <div
          class="thanks-progress"
          role="progressbar"
          aria-label="Progresso da confirmação"
          aria-valuenow="80"
        >
          <span class="thanks-progress-track" aria-hidden="true">
            <span class="thanks-progress-fill"></span>
          </span>
          <span aria-hidden="true">80%</span>
        </div>
        <p class="thanks-lead">
          Confirme sua participação no grupo oficial do WhatsApp. É lá que
          vamos enviar os links dos encontros ao vivo e os avisos do workshop.
        </p>
        <a
          class="cta thanks-cta"
          href="https://chat.whatsapp.com/DMhusxiIXP57HIJkxbxgNU?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.5L3 20.6l1.3-4.7a8.5 8.5 0 1 1 16.2-4.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M8.5 8.1c-.3-.1-.7 0-.9.3-.8 1-.1 2.7 1.5 4.3 1.6 1.7 3.4 2.6 4.7 2.3.6-.1 1.1-.7 1.2-1.2.1-.3 0-.4-.2-.6l-1.8-1c-.2-.1-.4-.1-.6.1l-.6.6c-.6-.2-1.8-1.4-2.1-2l.5-.7c.2-.2.2-.4.1-.6l-.7-1.5c-.1-.3-.3-.4-.6-.4Z" fill="currentColor" />
          </svg>
          Entrar no grupo do WhatsApp
        </a>
        <p class="thanks-date">09, 10 e 11 de dezembro às 20h · Online</p>
      </section>
    </main>
  </body>
</html>
